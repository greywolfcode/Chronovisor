name: chronovisor
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  resizable_widget: ^1.0.5
  archive: ^4.0.9
  drift: ^2.34.1
  drift_flutter: ^0.3.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.2+1
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  fonts:
    - family: Google Sans
      fonts: 
        - asset: 'resources/Google_Sans/GoogleSans-VariableFont_GRAD,opsz,wght.ttf'
        - asset: 'resources/Google_Sans/GoogleSans-Italic-VariableFont_GRAD,opsz,wght.ttf'
          style: italic
    - family: Roboto
      fonts: 
        - asset: 'resources/Roboto/Roboto-VariableFont_wdth,wght.ttf'
        - asset: 'resources/Roboto/Roboto-Italic-VariableFont_wdth,wght.ttf'
          style: italic
